<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryPal Homepage</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1>PantryPal</h1>
        <nav>
                <a href="#">Shopping List</a></li>
                <a href="#">Pantry</a></li>
        </nav>
    </header>
    <main>
        <section id="quick-stats">
            <h2>Quick Stats</h2>
            <ul>
              <li>
                <div class="total_items">
                  <p>Total Items</p>
                  <p>15</p>
                </div>
                <div class="items_running_low">
                  <p>Items Running Low</p>
                  <p>3</p>
                </div>
                <div class="items_out_of_stock">
                  <p>Items Out of Stock</p>
                  <p>2</p>
                </div>
                <div class="items_in_shopping_list">
                  <p>Items in Shopping List</p>
                  <p>15</p>
                </div>
                <div class="items_that_have_barcode">
                  <p>Items That Have a Barcode</p>
                  <p>15</p>
                </div>
                <div class="items_expiring_soon">
                  <p>Items Expiring Soon</p>
                  <p>5</p>
                </div>
              </li>
            </ul>
        </section>



    </main>
</body>
</html>
